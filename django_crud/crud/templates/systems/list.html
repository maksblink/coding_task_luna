<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Systemów</title>
</head>
<body>
    <h1>Lista Systemów</h1>
    <ul>
        {% for system in systems %}
            <li>{{ system.name }}</li>
        {% empty %}
            <li>Brak systemów w bazie.</li>
        {% endfor %}
    </ul>
</body>
</html>
