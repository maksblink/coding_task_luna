<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodaj pomiar</title>
</head>
<body>
    <h1>Dodaj pomiar do systemu: {{ hydroponic_system.name }}</h1>

    <form method="POST">
        {% csrf_token %}
        <label for="sensor">Wybierz czujnik:</label>
        <select name="sensor" id="sensor">
            {% for sensor in sensors %}
                <option value="{{ sensor.id }}">{{ sensor.sensor_type }}</option>
            {% endfor %}
        </select>

        <br>
        <label for="value">Wartość pomiaru:</label>
        <input type="number" step="0.01" name="value" required>

        <br>
        <label for="timestamp">Data i godzina (opcjonalnie):</label>
        <input type="datetime-local" name="timestamp">

        <br>
        <button type="submit">✅ Dodaj</button>
    </form>

    <br>
    <a href="{% url 'home' %}">⬅ Powrót do strony głównej</a>
</body>
</html>
